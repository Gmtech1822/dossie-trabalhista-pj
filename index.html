<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossiê Trabalhista PJ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Dossiê Trabalhista PJ</h1>
        <p class="subtitulo">Plataforma de Auditoria e Blindagem de Vínculos</p>

        <!-- Formulário de Cadastro -->
        <div class="form-card">
            <label>Seu Nome Completo:</label>
            <input type="text" id="nome" placeholder="Ex: João da Silva">

            <label>CPF ou CNPJ da Contratante:</label>
            <input type="text" id="cpfCnpj" placeholder="Ex: 00.000.000/0001-00">

            <label>Empresa Tomadora:</label>
            <input type="text" id="empresa" placeholder="Ex: Nome da Empresa">

            <label>Salário Base Mensal (R$):</label>
            <input type="number" id="salarioBase" placeholder="Ex: 3500.00">

            <button id="btnSalvar" onclick="salvarPerfil()">Salvar e Blindar Vínculo</button>
        </div>

        <!-- Seção de Listagem -->
        <div class="secao-lista">
            <h2>Vínculos Salvos na Nuvem</h2>
            <div id="listaUsuarios">Carregando registros...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
