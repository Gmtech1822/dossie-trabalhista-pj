<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossiê Trabalhista PJ</title>
    <!-- Estilos do projeto (se houver) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Dossiê Trabalhista PJ</h1>
        <p>Plataforma de Auditoria e Blindagem de Vínculos</p>

        <!-- Formulário de Cadastro -->
        <form>
            <label for="nome_completo">Seu Nome Completo:</label>
            <input type="text" id="nome_completo" name="nome_completo" required>

            <label for="documento">CPF ou CNPJ da Contratante:</label>
            <input type="text" id="documento" name="documento" required>

            <label for="empresa">Empresa Tomadora:</label>
            <input type="text" id="empresa" name="empresa" required>

            <label for="salario">Salário Base Mensal (R$):</label>
            <input type="number" id="salario" name="salario" step="0.01" required>

            <button type="submit">Salvar e Blindar Vínculo</button>
        </form>

        <!-- Seção de Listagem -->
        <div class="secao-lista">
            <h2>Vínculos Salvos na Nuvem</h2>
            <div id="listaUsuarios">Carregando registros...</div>
        </div>
    </div>

    <!-- Biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Seu arquivo de lógica -->
    <script src="app.js"></script>
</body>
</html>
